# Publishes to the WordPress.org plugin directory (SVN) when a GitHub release is published.
# Requires repo secrets SVN_USERNAME / SVN_PASSWORD (the WordPress.org account that owns the plugin).
name: Deploy to WordPress.org
on:
  release:
    types: [published]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: hay-chat
