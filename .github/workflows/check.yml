name: Plugin Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wordpress/plugin-check-action@v1
        with:
          slug: hay-chat
          exclude-files: .gitignore,.distignore,WIP.md
          exclude-directories: .github
